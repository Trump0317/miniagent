[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniagent"
version = "1.0.0"
description = "基于 LLM 的智能助手框架 — ReAct 模式 + 事件驱动 + 树状会话"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]
authors = []

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn>=0.23", "websockets>=12.0"]
tui = ["prompt-toolkit>=3.0", "rich>=13.0"]
mcp = ["mcp>=1.0"]
all = ["miniagent[web,tui,mcp]"]

[project.scripts]
miniagent = "agent:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
"agent.core" = ["system_prompt.md"]
"agent.subagent" = ["*.md"]
"agent.prompts" = ["*.md"]
"agent.web" = ["static/index.html"]
