<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniagent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex}
/* 侧栏 */
#sidebar{width:220px;background:#111;display:flex;flex-direction:column;border-right:1px solid #333;flex-shrink:0}
#sidebar h2{padding:16px;font-size:15px;border-bottom:1px solid #333}
#sidebar button{border:none;background:#6c63ff;color:#fff;padding:8px;margin:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
#sidebar button:hover{opacity:.9}
#session-list{flex:1;overflow-y:auto;list-style:none}
#session-list li{padding:10px 16px;cursor:pointer;border-bottom:1px solid #222;font-size:13px;color:#aaa}
#session-list li:hover{background:#1a1a2e}
#session-list li.active{background:#6c63ff;color:#fff}
#session-list li .time{font-size:11px;color:#666;display:block}
#session-list li.active .time{color:#ddd}
/* 主区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#header{padding:10px 20px;font-size:15px;font-weight:bold;border-bottom:1px solid #333;background:#16213e}
#messages{flex:1;overflow-y:auto;padding:16px}
#input-area{display:flex;border-top:1px solid #333;padding:10px}
#input{flex:1;padding:10px;border:1px solid #444;border-radius:6px;background:#16213e;color:#e0e0e0;font:inherit;resize:none;min-height:40px;max-height:120px}
#input:focus{outline:none;border-color:#6c63ff}
#send{padding:10px 20px;margin-left:8px;background:#6c63ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font:inherit}
#send:disabled{opacity:.5;cursor:default}
.msg{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#6c63ff;color:#fff;margin-left:auto}
.msg.assistant{background:#2d2d4a;color:#e0e0e0}
#status{font-size:12px;color:#888;text-align:center;padding:4px;min-height:20px}
</style>
</head>
<body>
<div id="sidebar">
  <h2>miniagent</h2>
  <button onclick="newSession()">+ 新建会话</button>
  <ul id="session-list"></ul>
</div>

<div id="main">
  <div id="header"></div>
  <div id="messages"></div>
  <div id="status"></div>
  <div id="input-area">
    <textarea id="input" placeholder="输入消息，Enter 发送" rows="1"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>
</div>

<script>
let ws = null;
let busy = false;
let currentSession = null;
const msgBox = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');
const header = document.getElementById('header');
const sessionList = document.getElementById('session-list');

// ── WebSocket ──

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => { status.textContent = '已连接'; loadSessions(); };
  ws.onclose = () => { status.textContent = '断开，刷新重连'; };
  ws.onerror = () => { status.textContent = '连接错误'; };

  ws.onmessage = null; // will be set per-message
}

// ── 会话管理 ──

async function loadSessions() {
  let sessions = [];
  try {
    const resp = await fetch('/api/sessions');
    sessions = await resp.json();
  } catch(e) {}

  if (sessions.length === 0) {
    await newSession();
    return;
  }
  renderSessions(sessions);
  selectSession(sessions[0].id);
}

async function newSession() {
  const resp = await fetch('/api/sessions', { method: 'POST' });
  const data = await resp.json();
  selectSession(data.id);
  loadSessions(); // 刷新列表
}

function renderSessions(sessions) {
  sessionList.innerHTML = '';
  for (const s of sessions) {
    const li = document.createElement('li');
    li.dataset.id = s.id;
    const date = new Date(s.created).toLocaleString('zh-CN');
    li.innerHTML = `${s.id}<span class="time">${date}</span>`;
    li.onclick = () => selectSession(s.id);
    sessionList.appendChild(li);
  }
}

// ── 消息缓存（按会话）──
const msgCache = {}; // session_id → [htmlElement, ...] 或 innerHTML string

function selectSession(sid) {
  if (sid === currentSession) return;
  // 保存当前会话的消息
  if (currentSession) {
    msgCache[currentSession] = msgBox.innerHTML;
  }
  currentSession = sid;
  // 恢复目标会话的消息
  msgBox.innerHTML = msgCache[sid] || '';
  header.textContent = '会话: ' + sid;
  // 更新侧栏高亮
  for (const li of sessionList.children) {
    li.classList.toggle('active', li.dataset.id === sid);
  }
  // 通知后端
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'switch', session_id: sid }));
  }
}

// ── 发送消息 ──

function append(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
}

function send() {
  if (!ws || ws.readyState !== WebSocket.OPEN || busy || !currentSession) return;
  const text = input.value.trim();
  if (!text) return;

  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  status.textContent = '思考中...';

  append('user', text);
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'msg assistant';
  assistantDiv.textContent = '';
  msgBox.appendChild(assistantDiv);

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'text') {
      assistantDiv.textContent += data.content;
      msgBox.scrollTop = msgBox.scrollHeight;
    } else if (data.type === 'done') {
      busy = false;
      sendBtn.disabled = false;
      status.textContent = '就绪';
      input.focus();
      ws.onmessage = null;
    }
  };

  ws.send(JSON.stringify({ type: 'message', session_id: currentSession, content: text }));
}

// ── 快捷键 ──

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

connect();
</script>
</body>
</html>
