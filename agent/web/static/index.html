<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniagent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:14px/1.6 sans-serif;background:#1a1a2e;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
#header{background:#16213e;padding:10px 20px;font-size:16px;font-weight:bold;border-bottom:1px solid #333}
#messages{flex:1;overflow-y:auto;padding:16px}
#input-area{display:flex;border-top:1px solid #333;padding:10px}
#input{flex:1;padding:10px;border:1px solid #444;border-radius:6px;background:#16213e;color:#e0e0e0;font:inherit;resize:none;min-height:40px;max-height:120px}
#input:focus{outline:none;border-color:#6c63ff}
#send{padding:10px 20px;margin-left:8px;background:#6c63ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font:inherit}
#send:disabled{opacity:.5;cursor:default}
.msg{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.user{background:#6c63ff;color:#fff;margin-left:auto}
.msg.assistant{background:#2d2d4a;color:#e0e0e0}
.msg.system{font-size:12px;color:#888;text-align:center;margin:4px 0;padding:4px}
#status{font-size:12px;color:#888;text-align:center;padding:4px;min-height:20px}
.msg.assistant .tool{color:#f0a040;font-size:12px}
</style>
</head>
<body>
<div id="header">miniagent</div>
<div id="messages"></div>
<div id="status"></div>
<div id="input-area">
  <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>

<script>
let ws = null;
let busy = false;
const msgBox = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const status = document.getElementById('status');

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => { status.textContent = '已连接'; };
  ws.onclose = () => { status.textContent = '连接断开，刷新重连'; };
  ws.onerror = () => { status.textContent = '连接错误'; };
}

function append(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  msgBox.appendChild(div);
  msgBox.scrollTop = msgBox.scrollHeight;
}

function send() {
  if (!ws || ws.readyState !== WebSocket.OPEN || busy) return;
  const text = input.value.trim();
  if (!text) return;

  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  status.textContent = '思考中...';

  append('user', text);
  const assistantDiv = document.createElement('div');
  assistantDiv.className = 'msg assistant';
  assistantDiv.textContent = '';
  msgBox.appendChild(assistantDiv);

  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'text') {
      assistantDiv.textContent += data.content;
      msgBox.scrollTop = msgBox.scrollHeight;
    } else if (data.type === 'done') {
      busy = false;
      sendBtn.disabled = false;
      status.textContent = '就绪';
      input.focus();
      ws.onmessage = null;
    }
  };

  ws.send(JSON.stringify({ type: 'message', content: text }));
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

connect();
</script>
</body>
</html>
