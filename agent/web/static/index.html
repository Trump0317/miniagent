<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miniagent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a12;--surface:#12121f;--surface2:#181828;--border:#22223a;
  --text:#c8c8d4;--text2:#8888a0;--text3:#555568;
  --accent:#7c7cff;--accent2:#5b5be0;--accent-glow:rgba(124,124,255,.15);
  --danger:#e05555;--success:#4caf50;--warn:#f0a040;
  --radius:10px;--radius-sm:6px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'JetBrains Mono','SF Mono','Fira Code',monospace;
  --shadow:0 4px 24px rgba(0,0,0,.3);
  --transition:.2s cubic-bezier(.4,0,.2,1);
}
body{font:14px/1.6 var(--font);background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
/* ── 侧栏 ── */
#sidebar{width:260px;background:var(--surface);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0;transition:width var(--transition);overflow:hidden}
#sidebar.collapsed{width:0;border-right:none}
.sidebar-header{padding:16px;display:flex;align-items:center;justify-content:space-between}
.sidebar-header .logo{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.5px}
.sidebar-header .toggle{font-size:14px;color:var(--text2);cursor:pointer;padding:4px 8px;border-radius:var(--radius-sm);transition:color var(--transition)}
.sidebar-header .toggle:hover{color:var(--text)}
.btn-new{margin:0 12px 8px;padding:8px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font:13px var(--font);font-weight:500;transition:all var(--transition);display:flex;align-items:center;justify-content:center;gap:4px}
.btn-new:hover{background:var(--accent2);box-shadow:0 2px 12px var(--accent-glow)}
#session-list{flex:1;overflow-y:auto;list-style:none;padding:4px 8px}
#session-list li{position:relative;padding:8px 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;cursor:pointer;transition:all .15s;margin:1px 0}
#session-list li:hover{background:var(--surface2);color:var(--text)}
#session-list li.active{background:var(--accent-glow);color:var(--accent);font-weight:500}
#session-list li .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#session-list li .del{opacity:0;font-size:16px;color:var(--danger);cursor:pointer;padding:0 2px;transition:opacity .15s;line-height:1}
#session-list li:hover .del{opacity:.7}
#session-list li .del:hover{opacity:1}
#tree-section{border-top:1px solid var(--border);margin-top:auto;overflow:hidden}
#tree-section .title{font-size:11px;color:var(--text3);padding:8px 12px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
#tree-view{font:11px/1.8 var(--mono);color:var(--text2);padding:4px 10px;max-height:220px;overflow-y:auto}
#tree-view .user-node{color:var(--accent);cursor:pointer;transition:color .15s}
#tree-view .user-node:hover{color:#aaa}
#tree-view .current{color:var(--text);font-weight:600}
.tree-actions{padding:4px 10px;display:flex;gap:4px}
.tree-actions button{flex:1;font:11px var(--font);padding:4px 8px;background:var(--surface2);color:var(--text2);border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.tree-actions button:hover{color:var(--text);background:#222240}
/* ── 主区 ── */
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#header{height:48px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--text2);flex-shrink:0}
#header .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success)}
#header .toggle-sidebar{font-size:18px;cursor:pointer;color:var(--text3);padding:2px 6px;transition:color .15s}
#header .toggle-sidebar:hover{color:var(--text)}
#messages{flex:1;overflow-y:auto;padding:20px 24px;scroll-behavior:smooth}
#messages::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* 空状态 */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text2)}
.landing .icon{font-size:48px;margin-bottom:16px;opacity:.3}
.landing .title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px}
.landing .sub{font-size:13px;color:var(--text3)}
/* 输入区 */
#input-area{display:flex;padding:12px 20px 16px;gap:10px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
#input-wrap{flex:1;position:relative}
#input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font:14px var(--font);resize:none;min-height:44px;max-height:140px;outline:none;transition:border-color var(--transition)}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
#input::placeholder{color:var(--text3)}
#send{padding:0 18px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font:14px var(--font);font-weight:600;transition:all var(--transition);display:flex;align-items:center;gap:6px;white-space:nowrap}
#send:hover{background:var(--accent2);box-shadow:0 2px 16px var(--accent-glow)}
#send:disabled{opacity:.35;cursor:default;box-shadow:none}
#send svg{width:16px;height:16px}
#stop-btn{padding:0 14px;background:var(--danger);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;transition:all var(--transition);display:none;align-items:center}
#stop-btn:hover{background:#c44;box-shadow:0 2px 12px rgba(224,85,85,.3)}
#stop-btn.visible{display:flex}
/* ── 消息 ── */
.msg-row{margin:16px 0;display:flex;gap:10px;animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{justify-content:flex-end}
.msg-row.user .bubble{background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px;max-width:70%}
.msg-row.assistant{gap:10px}
.msg-row.assistant .bubble{max-width:92%}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.avatar.assistant{background:var(--surface2);color:var(--accent)}
.bubble{padding:10px 16px;font-size:14px;line-height:1.65;box-shadow:var(--shadow);word-break:break-word}
.bubble.assistant{background:var(--surface);border:1px solid var(--border);border-radius:4px 16px 16px 16px}
.msg-row .time{font-size:10px;color:var(--text3);margin-top:4px}
/* Markdown */
.bubble h1,.bubble h2,.bubble h3{font-size:1.05em;margin:14px 0 6px;color:var(--text)}
.bubble h1{font-size:1.15em;border-bottom:1px solid var(--border);padding-bottom:6px}
.bubble code{background:rgba(124,124,255,.1);color:var(--accent);padding:2px 6px;border-radius:4px;font:12px var(--mono)}
.bubble pre{position:relative;background:#0a0a14;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin:12px 0;overflow-x:auto;font:12px/1.6 var(--mono);color:var(--text)}
.bubble pre code{background:none;padding:0;color:inherit;font:inherit}
.copy-btn{position:absolute;top:8px;right:8px;padding:4px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;color:var(--text2);font:11px var(--font);cursor:pointer;opacity:0;transition:opacity .15s}
.bubble pre:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--text);border-color:var(--accent)}
.bubble ul,.bubble ol{padding-left:22px;margin:6px 0}
.bubble li{margin:4px 0}
.bubble strong{color:var(--text);font-weight:600}
.bubble a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.bubble blockquote{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--text2);margin:10px 0}
.bubble table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
.bubble th,.bubble td{border:1px solid var(--border);padding:6px 12px;text-align:left}
.bubble th{background:var(--surface2);font-weight:600}
.bubble hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.bubble p{margin:4px 0}
/* 工具 */
.tool-line{display:flex;align-items:center;gap:6px;padding:5px 12px;font:12px var(--font);color:var(--text2);animation:slideIn .2s ease-out}
.tool-line .icon{font-size:13px;width:16px;text-align:center}
.tool-done .icon{color:var(--success)}
.tool-running .icon{color:var(--warn);animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-output{margin:2px 0 2px 28px;padding:10px 14px;background:#0a0a14;border-left:2px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font:12px/1.5 var(--mono);color:var(--text3);max-width:95%;white-space:pre-wrap;max-height:200px;overflow-y:auto;display:none}
.tool-output.open{display:block}
.tool-toggle{cursor:pointer;color:var(--accent);font:11px var(--font);margin-left:32px;user-select:none;padding:2px 0;transition:color .15s}
.tool-toggle:hover{color:var(--text)}
/* 状态条 */
#status{font:11px var(--font);color:var(--text3);text-align:center;padding:2px 0 6px;transition:color .3s}
#status.thinking{color:var(--warn)}
/* 设置面板 */
#settings-btn{cursor:pointer;font-size:16px;color:var(--text3);padding:2px 6px;border-radius:var(--radius-sm);transition:all .15s;background:none;border:none;margin-left:auto}
#settings-btn:hover{color:var(--text);background:var(--surface2)}
#settings-panel{display:none;position:absolute;top:52px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;width:260px;box-shadow:var(--shadow);z-index:100;font-size:13px}
#settings-panel.open{display:block}
#settings-panel label{display:block;color:var(--text2);font-size:11px;margin:8px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
#settings-panel label:first-child{margin-top:0}
#settings-panel input,#settings-panel select{width:100%;padding:7px 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font:13px var(--font)}
#settings-panel input:focus,#settings-panel select:focus{outline:none;border-color:var(--accent)}
#settings-panel select{appearance:none;-webkit-appearance:none;cursor:pointer}
#settings-panel .save-btn{margin-top:12px;width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font:13px var(--font);font-weight:500;cursor:pointer;transition:all var(--transition)}
#settings-panel .save-btn:hover{background:var(--accent2)}
/* 文件上传 */
#upload-btn{cursor:pointer;font-size:18px;color:var(--text3);padding:6px 10px;border-radius:var(--radius-sm);transition:all .15s;display:flex;align-items:center;border:none;background:none}
#upload-btn:hover{color:var(--accent);background:var(--surface2)}
#upload-status{font:11px var(--font);color:var(--text3);margin-left:4px;display:none}
/* 拖放区 */
#drop-zone{display:none;position:absolute;inset:0;background:rgba(124,124,255,.08);border:2px dashed var(--accent);border-radius:var(--radius);align-items:center;justify-content:center;font-size:16px;color:var(--accent);z-index:50;pointer-events:none}
#drop-zone.show{display:flex}
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <span class="logo">✦ miniagent</span>
    <span class="toggle" onclick="toggleSidebar()" title="折叠侧栏">◀</span>
  </div>
  <button class="btn-new" onclick="newSession()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新建会话
  </button>
  <ul id="session-list"></ul>
  <div id="tree-section" style="display:none">
    <div class="title">会话分支</div>
    <div id="tree-view"></div>
    <div class="tree-actions">
      <button onclick="doBack()">← 返回</button>
      <button onclick="refreshTree()">刷新</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="header">
    <span class="toggle-sidebar" onclick="toggleSidebar()" title="侧栏">☰</span>
    <span class="dot"></span>
    <span id="header-text">miniagent</span>
    <button id="settings-btn" onclick="toggleSettings()" title="设置">⚙</button>
    <div id="settings-panel">
      <label>模型</label>
      <input id="cfg-model" placeholder="deepseek-v4-flash">
      <label>思考级别</label>
      <select id="cfg-thinking">
        <option value="off">off</option>
        <option value="minimal">minimal</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
        <option value="xhigh">xhigh</option>
      </select>
      <label>最大轮数（0=无限制）</label>
      <input id="cfg-turns" type="number" min="0" value="0" placeholder="0">
      <button class="save-btn" onclick="saveSettings()">应用</button>
    </div>
  </div>
  <div id="messages">
    <div class="landing" id="landing">
      <div class="icon">✦</div>
      <div class="title">miniagent</div>
      <div class="sub">智能编程助手 · 输入消息开始对话</div>
    </div>
  </div>
  <div id="status"></div>
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <div id="drop-zone">📂 释放文件以上传</div>
    </div>
    <button id="upload-btn" onclick="document.getElementById('file-input').click()" title="上传文件">📎</button>
    <span id="upload-status"></span>
    <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(this.files)" multiple>
    <button id="send" onclick="send()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      发送
    </button>
    <button id="stop-btn" onclick="stopGeneration()" title="停止生成">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    </button>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  marked.setOptions({ breaks:true, gfm:true });
  if (typeof hljs !== 'undefined') {
    marked.setOptions({
      highlight: (code, lang) => {
        if (lang && hljs.getLanguage(lang)) {
          try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
        }
        try { return hljs.highlightAuto(code).value; } catch(e) { return code; }
      }
    });
  }
});

let ws = null, busy = false, currentSession = null, wsReconnectTimer = null;
let wsReconnectAttempts = 0;
const WS_MAX_RECONNECT = 10;
const WS_BASE_DELAY = 1000;
const msgBox = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const headerText = document.getElementById('header-text');
const sessionList = document.getElementById('session-list');
const landing = document.getElementById('landing');
let landingVisible = true;

function md(text) {
  try { return marked.parse(text); } catch(e) { return text; }
}

// ── 侧栏折叠 ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}

// ── WebSocket ──
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => {
    statusEl.textContent = '';
    wsReconnectAttempts = 0;
    clearWsTimer();
    loadSessions();
  };
  ws.onclose = () => {
    if (wsReconnectAttempts < WS_MAX_RECONNECT) {
      const delay = WS_BASE_DELAY * Math.pow(2, wsReconnectAttempts);
      wsReconnectAttempts++;
      statusEl.textContent = `连接断开 · ${Math.round(delay/1000)}s 后重连 (${wsReconnectAttempts}/${WS_MAX_RECONNECT})`;
      statusEl.className = '';
      clearWsTimer();
      wsReconnectTimer = setTimeout(connect, delay);
    } else {
      statusEl.textContent = '连接断开 · 已达最大重连次数，请刷新页面';
      statusEl.className = '';
    }
  };
  ws.onerror = () => { statusEl.textContent = '连接错误'; };
  // 统一的消息处理器，不随 send() 覆盖
  setupWsHandler();
}

function clearWsTimer() {
  if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
}

// ── 统一的消息处理器 ──
let _msgState = null; // { contentWrap, currentBubble, pendingOutputDiv, toolOutputLines, rawText }

function setupWsHandler() {
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (!_msgState) return; // 非活跃状态忽略
    const s = _msgState;
    if (data.type === 'text') {
      if (s.pendingOutputDiv) {
        s.pendingOutputDiv.textContent += data.content;
        s.toolOutputLines = s.pendingOutputDiv.textContent.split('\n').length;
        msgBox.scrollTop = msgBox.scrollHeight;
      } else {
        s.rawText += data.content;
        ensureBubble(s);
        renderBubble(s);
        msgBox.scrollTop = msgBox.scrollHeight;
      }
    } else if (data.type === 'reasoning') {
      // 思维链内容：作为折叠的 thinking 块展示
      if (!s._thinkingDiv) {
        s._thinkingDiv = document.createElement('div');
        s._thinkingDiv.className = 'tool-output open';
        const label = document.createElement('div');
        label.className = 'tool-line tool-running';
        label.innerHTML = '<span class=icon>💭</span> Thinking...';
        s.contentWrap.appendChild(label);
        s.contentWrap.appendChild(s._thinkingDiv);
      }
      s._thinkingDiv.textContent += data.content;
      msgBox.scrollTop = msgBox.scrollHeight;
    } else if (data.type === 'tool_status') {
      const isDone = data.content.includes('✓');
      flushTool(s);
      // 标记 thinking 结束（如果有）
      if (s._thinkingDiv) {
        const thinkingDiv = s._thinkingDiv;  // 捕获引用，避免闭包失效
        const prevLabel = thinkingDiv.previousElementSibling;
        if (prevLabel) {
          prevLabel.className = 'tool-line tool-done';
          prevLabel.innerHTML = '<span class=icon>💭</span> Thought';
        }
        const t = document.createElement('div');
        t.className = 'tool-toggle';
        const thinkLines = thinkingDiv.textContent.split('\n').length;
        t.textContent = '▸ 思考内容 (' + thinkLines + ' 行)';
        t.onclick = function() {
          const open = thinkingDiv.classList.toggle('open');
          this.textContent = (open ? '▾' : '▸') + ' 思考内容 (' + thinkLines + ' 行)';
        };
        s.contentWrap.appendChild(t);
        thinkingDiv.classList.remove('open'); // 默认折叠
        s._thinkingDiv = null;
      }
      const toolDiv = document.createElement('div');
      toolDiv.className = 'tool-line ' + (isDone ? 'tool-done' : 'tool-running');
      toolDiv.innerHTML = '<span class=icon>' + (isDone ? '✓' : '⚙') + '</span> ' + escapeHtml(data.content.trim());
      s.contentWrap.appendChild(toolDiv);
      if (!isDone) {
        s.pendingOutputDiv = document.createElement('div');
        s.pendingOutputDiv.className = 'tool-output open';
        s.contentWrap.appendChild(s.pendingOutputDiv);
      }
      msgBox.scrollTop = msgBox.scrollHeight;
    } else if (data.type === 'tool_result') {
      // 工具最终结果（并行模式）：显示折叠输出
      const result = data.result || '';
      if (result) {
        const resultDiv = document.createElement('div');
        resultDiv.className = 'tool-output';
        resultDiv.textContent = result;
        s.contentWrap.appendChild(resultDiv);
        const resultLines = result.split('\n').length;
        const toggle = document.createElement('div');
        toggle.className = 'tool-toggle';
        toggle.textContent = '▸ 输出 (' + resultLines + ' 行)';
        toggle.onclick = function() {
          const open = resultDiv.classList.toggle('open');
          this.textContent = (open ? '▾' : '▸') + ' 输出 (' + resultLines + ' 行)';
        };
        s.contentWrap.appendChild(toggle);
        msgBox.scrollTop = msgBox.scrollHeight;
      }
    } else if (data.type === 'done') {
      // 标记 thinking 结束
      if (s._thinkingDiv) {
        const prevLabel = s._thinkingDiv.previousElementSibling;
        if (prevLabel) prevLabel.innerHTML = '<span class=icon>💭</span> Thought';
      }
      finishMessage(s);
    }
  };
}

// ── 会话 ──
async function loadSessions() {
  let sessions = [];
  try { sessions = await (await fetch('/api/sessions')).json(); } catch(e) {}
  if (!sessions.length) { await newSession(); return; }
  renderSessions(sessions);
  selectSession(sessions[0].id);
}

async function newSession() {
  const data = await (await fetch('/api/sessions', { method: 'POST' })).json();
  selectSession(data.id);
  loadSessions();
}

function renderSessions(sessions) {
  sessionList.innerHTML = '';
  for (const s of sessions) {
    const li = document.createElement('li');
    li.dataset.id = s.id;
    li.innerHTML = `<span class="name">${s.id}</span><span class="del">×</span>`;
    li.onclick = (e) => { if (!e.target.classList.contains('del')) selectSession(s.id); };
    li.querySelector('.del').onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    li.querySelector('.name').ondblclick = () => renameSession(li, s.id);
    sessionList.appendChild(li);
  }
}

function renameSession(li, sid) {
  const nameEl = li.querySelector('.name');
  const inp = document.createElement('input');
  inp.value = sid;
  inp.style.cssText = 'background:transparent;border:none;color:inherit;font:inherit;width:100%;outline:none;border-bottom:1px solid var(--accent)';
  inp.onblur = () => selectSession(sid);
  inp.onkeydown = (e) => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = sid; inp.blur(); } };
  nameEl.innerHTML = ''; nameEl.appendChild(inp);
  inp.focus(); inp.select();
}

async function deleteSession(sid) {
  if (!confirm('删除会话 ' + sid + '？')) return;
  if (sid === currentSession) currentSession = null;
  loadSessions();
}

async function selectSession(sid) {
  if (sid === currentSession) return;
  currentSession = sid;
  headerText.textContent = '会话: ' + sid;
  for (const li of sessionList.children) li.classList.toggle('active', li.dataset.id === sid);
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'switch', session_id: sid }));
  await loadHistory(sid);
  refreshTree();
  // 加载模型信息
  try {
    const data = await (await fetch('/api/sessions/' + sid + '/settings')).json();
    if (data.model) headerText.textContent = '会话: ' + sid + ' · ' + data.model;
  } catch(e) {}
}

async function loadHistory(sid) {
  try {
    const resp = await fetch('/api/sessions/' + sid + '/history');
    const messages = await resp.json();
    if (landingVisible && messages.length > 0) { landing.style.display = 'none'; landingVisible = false; }
    msgBox.innerHTML = '';
    for (const m of messages) {
      if (m.role === 'user') {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="bubble">${escapeHtml(m.content)}</div>`;
        msgBox.appendChild(row);
      } else {
        const row = document.createElement('div');
        row.className = 'msg-row assistant';
        row.innerHTML = `<div class="avatar assistant">AI</div><div><div class="bubble assistant">${md(m.content)}</div></div>`;
        msgBox.appendChild(row);
      }
    }
    if (messages.length > 0) msgBox.scrollTop = msgBox.scrollHeight;
  } catch(e) {}
}

// ── 消息 ──
function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
}

async function send() {
  if (!ws || ws.readyState !== WebSocket.OPEN || busy || !currentSession) return;
  let text = input.value.trim();
  if (!text) return;

  busy = true; sendBtn.disabled = true;
  document.getElementById('stop-btn').classList.add('visible');
  statusEl.textContent = '思考中...'; statusEl.className = 'thinking';
  input.value = ''; input.style.height = 'auto';

  // 解析 @引用
  if (text.includes('@')) text = await resolveAtRefs(text);

  if (isCommand(text)) { busy = false; sendBtn.disabled = false; document.getElementById('stop-btn').classList.remove('visible'); statusEl.textContent = ''; statusEl.className = ''; input.focus(); return; }

  if (landingVisible) { landing.style.display = 'none'; landingVisible = false; }

  // 用户消息
  const userRow = document.createElement('div');
  userRow.className = 'msg-row user';
  userRow.innerHTML = `<div class="bubble">${text}</div><div style="font-size:10px;color:var(--text3);margin-top:2px">${now()}</div>`;
  msgBox.appendChild(userRow);

  // 助手
  const assistantRow = document.createElement('div');
  assistantRow.className = 'msg-row assistant';
  assistantRow.innerHTML = '<div class="avatar assistant">AI</div><div></div>';
  const contentWrap = assistantRow.children[1];
  msgBox.appendChild(assistantRow);

  // ── 消息状态初始化 ──
  _msgState = {
    contentWrap: contentWrap,
    currentBubble: null,
    pendingOutputDiv: null,
    toolOutputLines: 0,
    rawText: ''
  };

  ws.send(JSON.stringify({ type: 'message', session_id: currentSession, content: text }));
}

// ── 消息渲染工具函数（模块级）──

function flushTool(s) {
  // 捕获引用：onclick 闭包需要保留 DOM 引用，不能依赖 s.pendingOutputDiv（会被置 null）
  const outputDiv = s.pendingOutputDiv;
  const lines = s.toolOutputLines;
  if (outputDiv && lines > 0) {
    const t = document.createElement('div');
    t.className = 'tool-toggle';
    t.textContent = '▾ 工具输出 (' + lines + ' 行)';
    t.onclick = function() {
      const open = outputDiv.classList.toggle('open');
      this.textContent = (open ? '▾' : '▸') + ' 工具输出 (' + lines + ' 行)';
    };
    s.contentWrap.appendChild(t);
  }
  s.pendingOutputDiv = null; s.toolOutputLines = 0;
}

function ensureBubble(s) {
  if (!s.currentBubble) {
    s.currentBubble = document.createElement('div');
    s.currentBubble.className = 'bubble assistant';
    s.contentWrap.appendChild(s.currentBubble);
  }
  return s.currentBubble;
}

function renderBubble(s) {
  if (s.currentBubble) {
    let html = md(s.rawText);
    // 为 pre 添加复制按钮
    html = html.replace(/(<pre[^>]*>)/g, '$1<button class="copy-btn" onclick="navigator.clipboard.writeText(this.nextElementSibling.textContent);this.textContent=\'✓\';setTimeout(()=>this.textContent=\'复制\',1500)">复制</button>');
    s.currentBubble.innerHTML = html;
  }
}

function finishMessage(s) {
  flushTool(s);
  renderBubble(s);
  const timeEl = document.createElement('div');
  timeEl.style.cssText = 'font-size:10px;color:var(--text3);margin-top:4px';
  timeEl.textContent = now();
  s.contentWrap.appendChild(timeEl);
  _msgState = null;
  busy = false; sendBtn.disabled = false;
  document.getElementById('stop-btn').classList.remove('visible');
  statusEl.textContent = ''; statusEl.className = '';
  input.focus();
}

// ── 停止生成 ──
function stopGeneration() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'cancel' }));
  if (_msgState) {
    const cancelDiv = document.createElement('div');
    cancelDiv.className = 'tool-line';
    cancelDiv.innerHTML = '<span class=icon style=color:var(--danger)>■</span> 已停止生成';
    _msgState.contentWrap.appendChild(cancelDiv);
    finishMessage(_msgState);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ── @引用解析 ──
async function resolveAtRefs(text) {
  const refs = text.match(/@[\w./~-]+/g);
  if (!refs) return text;
  let resolved = text;
  for (const ref of refs) {
    try {
      const resp = await fetch('/api/upload/resolve', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path: ref.slice(1)})
      });
      const data = await resp.json();
      if (data.ok) {
        resolved = resolved.replace(ref, `# 文件: ${data.filename}\n\n${data.content}`);
      }
    } catch(e) {}
  }
  return resolved;
}

// ── 内置命令 ──
function isCommand(text) {
  if (text === '/tree') { refreshTree(); return true; }
  if (text === '/back') { doBack(); return true; }
  return false;
}

// ── 设置面板 ──
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  panel.classList.toggle('open');
  if (panel.classList.contains('open') && currentSession) loadSettings();
}

async function loadSettings() {
  if (!currentSession) return;
  try {
    const data = await (await fetch('/api/sessions/' + currentSession + '/settings')).json();
    document.getElementById('cfg-model').value = data.model || '';
    document.getElementById('cfg-thinking').value = data.thinking || 'off';
    document.getElementById('cfg-turns').value = data.max_turns || 0;
  } catch(e) {}
}

async function saveSettings() {
  if (!currentSession) return;
  const body = {};
  const model = document.getElementById('cfg-model').value.trim();
  const thinking = document.getElementById('cfg-thinking').value;
  const turns = parseInt(document.getElementById('cfg-turns').value) || 0;
  if (model) body.model = model;
  body.thinking = thinking;
  body.max_turns = turns > 0 ? turns : null;
  try {
    const resp = await fetch('/api/sessions/' + currentSession + '/settings', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (data.ok) {
      statusEl.textContent = '配置已更新'; statusEl.className = '';
      setTimeout(() => { statusEl.textContent = ''; }, 1500);
      document.getElementById('settings-panel').classList.remove('open');
      if (data.changes.model) headerText.textContent = '会话: ' + currentSession + ' · ' + data.changes.model.new;
    } else {
      statusEl.textContent = '错误: ' + data.error; statusEl.className = '';
    }
  } catch(e) {
    statusEl.textContent = '保存失败'; statusEl.className = '';
  }
}

document.addEventListener('click', (e) => {
  const panel = document.getElementById('settings-panel');
  const btn = document.getElementById('settings-btn');
  if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== btn) {
    panel.classList.remove('open');
  }
});

// ── 文件上传 ──
const uploadStatus = document.getElementById('upload-status');

async function handleFileUpload(files) {
  if (!currentSession) return;
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    uploadStatus.style.display = 'inline'; uploadStatus.textContent = '上传中...';
    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      if (data.ok) {
        input.value += (input.value ? '\n' : '') + data.ref;
        uploadStatus.textContent = '✓ ' + data.filename;
        setTimeout(() => { uploadStatus.style.display = 'none'; }, 2000);
      } else {
        uploadStatus.textContent = '✗ ' + data.error;
        setTimeout(() => { uploadStatus.style.display = 'none'; }, 2000);
      }
    } catch(e) {
      uploadStatus.textContent = '✗ 上传失败';
      setTimeout(() => { uploadStatus.style.display = 'none'; }, 2000);
    }
    input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    input.focus();
  }
  document.getElementById('file-input').value = '';
}

// ── 拖放文件 ──
const dropZone = document.getElementById('drop-zone');
const inputWrap = document.getElementById('input-wrap');

['dragenter','dragover'].forEach(e => {
  document.addEventListener(e, (ev) => { ev.preventDefault(); dropZone.classList.add('show'); });
});
['dragleave','drop'].forEach(e => {
  document.addEventListener(e, (ev) => {
    ev.preventDefault();
    dropZone.classList.remove('show');
    if (e === 'drop' && ev.dataTransfer?.files?.length) handleFileUpload(ev.dataTransfer.files);
  });
});

// ── 快捷键 ──
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  if (e.key === 'Escape') input.blur();
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; });

connect();

// ── 分支树 ──
async function refreshTree() {
  if (!currentSession) return;
  const data = await (await fetch('/api/sessions/' + currentSession + '/tree')).json();
  renderTree(data);
  document.getElementById('tree-section').style.display = 'block';
}

function renderTree(data) {
  const view = document.getElementById('tree-view');
  if (!data.nodes.length) { view.innerHTML = '<span style=color:var(--text3)>(空)</span>'; return; }
  const nodes = {}, children = {};
  for (const n of data.nodes) { nodes[n.id] = n; const pid = n.parent_id || 'root'; if (!children[pid]) children[pid] = []; children[pid].push(n); }
  for (const k of Object.keys(children)) children[k].sort((a,b) => a.timestamp - b.timestamp);
  let html = ''; const roots = children['root'] || [];
  for (let i = 0; i < roots.length; i++) html += _renderNode(roots[i], nodes, children, data.leaf_id, '', i === roots.length - 1);
  view.innerHTML = html;
}

function _short(text, role, type) {
  if (type === 'compaction') return '[压缩]'; if (role === 'tool') return '[tool]';
  return text.slice(0, 20);
}

function _renderNode(node, nodes, children, leafId, prefix, isLast) {
  const conn = prefix + (isLast ? '└ ' : '├ '), next = prefix + (isLast ? '  ' : '│ ');
  const marker = node.id === leafId ? '*' : '';
  const label = _short(node.content, node.role, node.type);
  const cls = node.role === 'user' ? ' class=user-node' : '';
  const onclick = (node.role === 'user' && node.parent_id) ? ` onclick="doFork('${node.parent_id}')" title=\"分叉到此消息之前\"` : '';
  const cur = node.id === leafId ? ' class=current' : '';
  let out = `<div>${conn}<span${cls}${onclick}><span${cur}>${node.role}: ${label}${marker}</span></span></div>`;
  if (isLast && marker) out = out.replace('└', '▶').replace('  ', '  ');
  const kids = children[node.id] || [];
  for (let i = 0; i < kids.length; i++) out += _renderNode(kids[i], nodes, children, leafId, next, i === kids.length - 1);
  return out;
}

async function doFork(targetId) {
  if (!currentSession) return;
  await fetch('/api/sessions/' + currentSession + '/fork?target_id=' + targetId, { method: 'POST' });
  await loadHistory(currentSession);
  refreshTree();
}

async function doBack() {
  if (!currentSession) return;
  const data = await (await fetch('/api/sessions/' + currentSession + '/back', { method: 'POST' })).json();
  if (data.ok) {
    await loadHistory(currentSession);
    refreshTree();
  } else {
    alert(data.error);
  }
}
